<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic-LR</title>
  <style>
    :root {
      --bg:      #f8f9fa;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --text:    #1a202c;
      --muted:   #718096;
      --accent:  #2563eb;
      --green:   #16a34a;
      --orange:  #ea580c;
      --faint:   #9ca3af;
      --arxiv:   #b91c1c;
      --s2:      #7c3aed;
      --oa:      #0891b2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

    /* ── Status bar ─────────────────────────────────────────── */
    #statusbar {
      background: var(--text); color: #fff;
      padding: 10px 20px; display: flex; align-items: center; gap: 14px;
    }
    #statusbar h1 { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
    .badge {
      padding: 2px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
      background: var(--accent); color: #fff;
    }
    .badge-server  { background: var(--green); }
    .badge-offline { background: var(--faint); }
    .sb-stat { font-size: 12px; color: #94a3b8; }
    .sb-stat strong { color: #fff; }

    /* ── Tab bar ────────────────────────────────────────────── */
    #tabbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 20px; display: flex; gap: 2px;
    }
    .tab {
      padding: 10px 16px; font-size: 13px; font-weight: 500;
      color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; user-select: none;
    }
    .tab.active  { color: var(--accent); border-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── Panel visibility ───────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Papers: controls ───────────────────────────────────── */
    #controls {
      padding: 10px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    }
    .ctrl-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    select { font-size: 12px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); }
    .src-chip {
      padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 700;
      cursor: pointer; opacity: .35; transition: opacity .15s; user-select: none;
    }
    .src-chip.on { opacity: 1; }
    .chip-arxiv { background: #fee2e2; color: var(--arxiv); }
    .chip-s2    { background: #ede9fe; color: var(--s2);    }
    .chip-oa    { background: #cffafe; color: var(--oa);    }
    #result-count { font-size: 12px; color: var(--muted); margin-left: auto; }

    /* ── Search box ─────────────────────────────────────────── */
    .search-wrap { position: relative; display: flex; align-items: center; }
    #search-input {
      width: 280px; padding: 5px 26px 5px 10px;
      font-size: 12px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); outline: none; transition: border-color .15s;
    }
    #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #dbeafe; }
    #search-input::-webkit-search-cancel-button { display: none; }
    .search-clear {
      position: absolute; right: 6px; background: none; border: none;
      font-size: 15px; color: var(--muted); cursor: pointer;
      display: none; line-height: 1; padding: 0 2px;
    }
    .search-clear:hover { color: var(--text); }
    .search-clear.visible { display: block; }
    mark { background: #fef08a; color: inherit; border-radius: 2px; padding: 0 1px; }

    /* ── Live search section ────────────────────────────────── */
    #live-search {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    #live-search summary {
      padding: 8px 20px; font-size: 12px; font-weight: 700; color: var(--muted);
      cursor: pointer; user-select: none; list-style: none;
      display: flex; align-items: center; gap: 8px;
    }
    #live-search summary::-webkit-details-marker { display: none; }
    #live-search summary::before { content: "▶"; font-size: 9px; transition: transform .15s; }
    #live-search[open] summary::before { transform: rotate(90deg); }
    #live-search summary:hover { color: var(--text); }
    #live-search summary .api-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 6px;
      background: var(--green); color: #fff; font-weight: 700;
    }
    .live-body { padding: 12px 20px 16px; }
    .live-row  { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    #live-q {
      flex: 1; min-width: 200px; max-width: 440px;
      padding: 6px 10px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 4px; outline: none;
    }
    #live-q:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #dbeafe; }
    .live-btn {
      padding: 6px 16px; font-size: 12px; font-weight: 700;
      background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer;
    }
    .live-btn:hover { background: #1d4ed8; }
    .live-btn:disabled { opacity: .5; cursor: default; }
    #live-status { font-size: 12px; color: var(--muted); }
    .live-section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      color: var(--muted); margin: 12px 0 6px;
    }
    #live-out { display: flex; flex-direction: column; gap: 6px; }
    .cand-card {
      background: #fff; border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
    }
    .cand-card.in-db { border-color: #86efac; background: #f0fdf4; }
    .cand-title  { font-size: 13px; font-weight: 600; color: var(--accent); }
    .cand-meta   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .cand-scores { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .cand-abstract { font-size: 11px; color: #374151; line-height: 1.55; margin-top: 6px; }
    .btn-add {
      padding: 4px 12px; font-size: 11px; font-weight: 700;
      color: var(--green); border: 1px solid #86efac; border-radius: 4px;
      background: var(--surface); cursor: pointer; white-space: nowrap;
    }
    .btn-add:hover { background: #dcfce7; }
    .btn-add:disabled { opacity: .5; cursor: default; }

    /* ── Papers: list ───────────────────────────────────────── */
    #paper-list { padding: 12px 20px; display: flex; flex-direction: column; gap: 6px; max-width: 1040px; }

    .paper-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .paper-main {
      padding: 10px 14px; cursor: pointer;
      display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: start;
    }
    .paper-main:hover { background: #f1f5f9; }

    /* score column */
    .score-col  { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 2px; }
    .score-num  { font-size: 12px; font-weight: 700; }
    .score-track { width: 36px; height: 4px; background: #e5e7eb; border-radius: 2px; }
    .score-fill  { height: 4px; border-radius: 2px; }
    .s-high { color: var(--green);  } .sf-high { background: var(--green);  }
    .s-mid  { color: var(--orange); } .sf-mid  { background: var(--orange); }
    .s-low  { color: var(--faint);  } .sf-low  { background: var(--faint);  }
    .emb-score { font-size: 10px; color: var(--faint); font-weight: 600; }

    /* paper body */
    .paper-body  { min-width: 0; }
    .paper-title { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; line-height: 1.4; }
    .paper-title:hover { text-decoration: underline; }
    .paper-meta  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .paper-srcs  { display: flex; gap: 4px; margin-top: 5px; }
    .src-tag     { padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 700; }
    .st-arxiv { background: #fee2e2; color: var(--arxiv); }
    .st-s2    { background: #ede9fe; color: var(--s2);    }
    .st-oa    { background: #cffafe; color: var(--oa);    }

    /* actions */
    .paper-acts  { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; padding-top: 2px; }
    .ilink {
      font-size: 10px; font-weight: 600; color: var(--muted); text-decoration: none;
      padding: 2px 6px; border: 1px solid var(--border); border-radius: 3px; white-space: nowrap;
    }
    .ilink:hover { color: var(--accent); border-color: var(--accent); }

    /* CRUD buttons */
    .crud-row { display: flex; gap: 4px; margin-top: 2px; justify-content: flex-end; }
    .crud-btn {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 3px; border: 1px solid; cursor: pointer;
      background: var(--surface); white-space: nowrap; line-height: 1.6;
    }
    .btn-reject  { color: var(--arxiv); border-color: #fca5a5; }
    .btn-reject:hover  { background: #fee2e2; }
    .btn-approve { color: var(--green); border-color: #86efac; }
    .btn-approve:hover { background: #dcfce7; }
    .btn-edit    { color: var(--accent); border-color: #93c5fd; }
    .btn-edit:hover    { background: #eff6ff; }
    .btn-delete  { color: var(--muted); border-color: var(--border); }
    .btn-delete:hover  { background: #f1f5f9; }

    /* expanded detail */
    .paper-detail { padding: 10px 14px 14px; border-top: 1px solid var(--border); background: #f8fafc; display: none; }
    .paper-detail.open { display: block; }
    .abstract  { font-size: 12px; line-height: 1.65; color: #374151; }
    .detail-ids { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .id-pill   { font-size: 10px; color: var(--muted); background: #e5e7eb; padding: 2px 7px; border-radius: 3px; }

    /* inline edit form */
    .edit-form { padding: 12px 0 0; display: none; }
    .edit-form.open { display: block; }
    .ef-label {
      display: block; font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .4px; margin: 10px 0 4px;
    }
    .ef-label:first-child { margin-top: 0; }
    .ef-input, .ef-textarea {
      width: 100%; padding: 5px 8px; font-size: 12px;
      border: 1px solid var(--border); border-radius: 4px; background: var(--surface);
      font-family: inherit;
    }
    .ef-textarea { resize: vertical; line-height: 1.6; }
    .ef-actions  { display: flex; gap: 8px; margin-top: 12px; }
    .btn-save    { color: #fff; background: var(--accent); border-color: var(--accent); }
    .btn-save:hover { background: #1d4ed8; }

    /* pagination */
    #pagination { padding: 14px 20px; display: flex; gap: 8px; align-items: center; }
    .page-btn { padding: 4px 12px; font-size: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); cursor: pointer; }
    .page-btn:hover:not(:disabled) { background: var(--bg); }
    .page-btn:disabled { opacity: .4; cursor: default; }
    .page-info { font-size: 12px; color: var(--muted); }

    /* ── Survey config panel ────────────────────────────────── */
    #panel-config { padding: 24px 20px; max-width: 720px; }
    .cfg-section { margin-bottom: 22px; }
    .cfg-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 7px; }
    .cfg-value { font-size: 13px; line-height: 1.5; }
    .cfg-rq { padding: 8px 12px; background: var(--surface); border-left: 3px solid var(--accent); font-size: 12px; margin-bottom: 6px; border-radius: 0 4px 4px 0; line-height: 1.5; }
    .cfg-pill { display: inline-block; background: #eff6ff; color: var(--accent); border: 1px solid #bfdbfe; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin: 2px; }

    /* ── Run history panel ──────────────────────────────────── */
    #panel-history { padding: 20px; max-width: 920px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 8px 10px; background: var(--surface); border-bottom: 2px solid var(--border); font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .ok  { color: var(--green);  font-weight: 700; }
    .err { color: var(--orange); font-weight: 700; }

    /* ── Rejects panel ──────────────────────────────────────── */
    #panel-rejects { padding: 12px 20px; max-width: 1040px; }
    .reject-reason {
      display: inline-block; padding: 2px 8px; border-radius: 8px;
      font-size: 10px; font-weight: 700; background: #fee2e2; color: var(--arxiv);
      text-transform: uppercase; letter-spacing: .4px;
    }
    .empty-state { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── Toast ──────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 10px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
      opacity: 0; transition: opacity .25s; z-index: 9999; pointer-events: none;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
    }
    .toast.show { opacity: 1; }
    .toast-info { background: #1e293b; color: #fff; }
    .toast-ok   { background: var(--green); color: #fff; }
    .toast-warn { background: var(--orange); color: #fff; }
    .toast-err  { background: #b91c1c; color: #fff; }
  </style>
</head>
<body>

<!-- Status bar -->
<div id="statusbar">
  <h1>Dynamic-LR</h1>
  <span id="sb-arch" class="badge">—</span>
  <span id="sb-server" class="badge badge-server" style="display:none">API Live</span>
  <span id="sb-papers" class="sb-stat"></span>
  <span id="sb-run"    class="sb-stat"></span>
</div>

<!-- Tab bar -->
<div id="tabbar">
  <div class="tab active" data-tab="papers">Papers</div>
  <div class="tab" data-tab="config">Survey Config</div>
  <div class="tab" data-tab="history">Run History</div>
  <div class="tab" data-tab="rejects">Rejects</div>
</div>

<!-- ── Papers panel ──────────────────────────────────── -->
<div id="panel-papers" class="panel active">
  <div id="controls">
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="Search title, abstract, authors…" autocomplete="off">
      <button id="search-clear" class="search-clear" title="Clear">×</button>
    </div>
    <span class="ctrl-label">Sort</span>
    <select id="sort-sel">
      <option value="score-desc">Score ↓</option>
      <option value="score-asc">Score ↑</option>
      <option value="emb-desc">Emb ↓</option>
      <option value="year-desc">Year ↓</option>
      <option value="year-asc">Year ↑</option>
      <option value="title-asc">Title A→Z</option>
    </select>
    <span class="ctrl-label">Sources</span>
    <div style="display:flex;gap:5px">
      <span class="src-chip chip-arxiv on" data-src="arxiv">arXiv</span>
      <span class="src-chip chip-s2 on"    data-src="semantic_scholar">S2</span>
      <span class="src-chip chip-oa on"    data-src="openalex">OpenAlex</span>
    </div>
    <span class="ctrl-label">Min score</span>
    <input type="range" id="score-range" min="0" max="1" step="0.01" value="0" style="width:80px">
    <span id="score-lbl" style="font-size:12px;color:var(--muted);min-width:28px">0.00</span>
    <span id="result-count"></span>
  </div>

  <!-- Live API search (only visible in server mode) -->
  <details id="live-search" style="display:none">
    <summary>Live API Search <span class="api-badge">LIVE</span></summary>
    <div class="live-body">
      <div class="live-row">
        <input id="live-q" type="text" placeholder="Search arXiv, Semantic Scholar, OpenAlex…">
        <button class="live-btn" id="live-go" onclick="liveSearch()">Search</button>
        <span id="live-status"></span>
      </div>
      <div id="live-out"></div>
    </div>
  </details>

  <div id="paper-list"></div>
  <div id="pagination"></div>
</div>

<!-- ── Survey config panel ───────────────────────────── -->
<div id="panel-config" class="panel">
  <div id="config-body"></div>
</div>

<!-- ── Run history panel ─────────────────────────────── -->
<div id="panel-history" class="panel">
  <div id="history-body"></div>
</div>

<!-- ── Rejects panel ─────────────────────────────────── -->
<div id="panel-rejects" class="panel">
  <div id="rejects-body"></div>
</div>

<script>
"use strict";
const PAGE = 50;
let papers = [], rejects = [], history = [], config = {}, status = {};
let activeSrc   = new Set(["arxiv","semantic_scholar","openalex"]);
let sortKey     = "score-desc";
let minScore    = 0;
let page        = 0;
let searchQuery = "";
let searchTimer = null;
let serverMode  = false;
let _liveCandidates = [];

// ── API helpers ────────────────────────────────────────────────────────────
async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(path, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
  return r.json();
}
async function apiPut(path, body) {
  const r = await fetch(path, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
  return r.json();
}
async function apiDelete(path) {
  const r = await fetch(path, { method: "DELETE" });
  if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
  return r.json();
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, type = "info") {
  const t = document.createElement("div");
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("show")));
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 3000);
}

// ── Bootstrap ──────────────────────────────────────────────────────────────
async function init() {
  // Try server mode first (2-second timeout)
  let usedServer = false;
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 2000);
    const r = await fetch("/api/status", { signal: ctrl.signal });
    clearTimeout(tid);
    if (r.ok) {
      usedServer = true;
      serverMode = true;
      const s = await r.json();
      status.architecture = "server";
      status.last_run = null;
      [papers, rejects] = await Promise.all([
        apiGet("/api/papers"),
        apiGet("/api/rejects"),
      ]);
      status.total_papers = papers.length;
      document.getElementById("sb-server").style.display = "";
      document.getElementById("live-search").style.display = "";
    }
  } catch (_) { /* not in server mode */ }

  if (!usedServer) {
    // Fall back to static JSON files
    try {
      [papers, rejects, history, config, status] = await Promise.all([
        fetch("data/papers.json").then(r => r.json()),
        fetch("data/rejects.json").then(r => r.json()),
        fetch("data/run_history.json").then(r => r.json()),
        fetch("data/survey_config.json").then(r => r.json()),
        fetch("data/system_status.json").then(r => r.json()),
      ]);
    } catch (e) {
      document.body.innerHTML =
        `<div style="padding:40px;font-family:monospace;color:#b91c1c">
          <b>Could not load data files.</b><br><br>${e}<br><br>
          Run the server: <code style="background:#f1f5f9;padding:4px 8px;border-radius:3px">python -m app.server</code><br>
          Or serve statically: <code style="background:#f1f5f9;padding:4px 8px;border-radius:3px">cd site &amp;&amp; python -m http.server 8000</code>
        </div>`;
      return;
    }
  }

  if (serverMode) {
    // Also load config and history from static (server keeps those updated on disk)
    try {
      [history, config] = await Promise.all([
        fetch("/data/run_history.json").then(r => r.json()),
        fetch("/data/survey_config.json").then(r => r.json()),
      ]);
    } catch (_) { /* use empty defaults */ }
  }

  renderStatus(); renderPapers(); renderConfig(); renderHistory(); renderRejects();
}

// ── Status bar ─────────────────────────────────────────────────────────────
function renderStatus() {
  document.getElementById("sb-arch").textContent = status.architecture || "—";
  document.getElementById("sb-papers").innerHTML =
    `<strong>${status.total_papers ?? papers.length}</strong> papers`;
  if (status.last_run) {
    const d = new Date(status.last_run);
    document.getElementById("sb-run").innerHTML =
      `last run <strong>${d.toLocaleDateString()} ${d.toLocaleTimeString()}</strong>`;
  }
}

// ── Tabs ───────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("panel-" + t.dataset.tab).classList.add("active");
}));

// ── Papers ─────────────────────────────────────────────────────────────────
function sorted() {
  const tokens = searchQuery.toLowerCase().split(/\s+/).filter(Boolean);
  return papers
    .filter(p => {
      if (p.score < minScore) return false;
      if (!(p.sources || []).some(s => activeSrc.has(s))) return false;
      if (tokens.length) {
        const hay = [p.title, p.abstract, ...(p.authors || [])].join(" ").toLowerCase();
        if (!tokens.every(t => hay.includes(t))) return false;
      }
      return true;
    })
    .sort((a, b) => {
      switch (sortKey) {
        case "score-desc": return b.score - a.score;
        case "score-asc":  return a.score - b.score;
        case "emb-desc":   return (b.embedding_score||0) - (a.embedding_score||0);
        case "year-desc":  return (b.year || 0) - (a.year || 0);
        case "year-asc":   return (a.year || 0) - (b.year || 0);
        case "title-asc":  return (a.title || "").localeCompare(b.title || "");
      }
      return 0;
    });
}

function scoreLevel(s) { return s >= 0.35 ? "high" : s >= 0.18 ? "mid" : "low"; }

function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function highlight(rawText, query) {
  const escaped = esc(rawText);
  if (!query) return escaped;
  const tokens = query.trim().split(/\s+/).filter(t => t.length > 1);
  if (!tokens.length) return escaped;
  const pattern = tokens.map(t => escRe(esc(t))).join("|");
  return escaped.replace(new RegExp(`(${pattern})`, "gi"), "<mark>$1</mark>");
}

function srcTag(src) {
  const m = { arxiv:"st-arxiv arXiv", semantic_scholar:"st-s2 S2", openalex:"st-oa OA" };
  const [cls, label] = (m[src] || "").split(" ");
  return cls ? `<span class="src-tag ${cls}">${label}</span>` : "";
}

function paperCard(p, uid) {
  const lvl  = scoreLevel(p.score);
  const ids  = p.identifiers || {};
  const pct  = Math.round(p.score * 100);
  const auth = (p.authors || []).slice(0, 3).join(", ") +
               ((p.authors || []).length > 3 ? " et al." : "");
  const srcs = (p.sources || []).map(srcTag).join("");

  const links = [
    p.pdf_url       && `<a class="ilink" href="${p.pdf_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">PDF</a>`,
    ids.doi         && `<a class="ilink" href="https://doi.org/${ids.doi}" target="_blank" rel="noopener" onclick="event.stopPropagation()">DOI</a>`,
    ids.arxiv_id    && `<a class="ilink" href="https://arxiv.org/abs/${ids.arxiv_id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">arXiv</a>`,
  ].filter(Boolean).join("");

  const pills = [
    ids.doi                  && `DOI: ${ids.doi}`,
    ids.arxiv_id             && `arXiv: ${ids.arxiv_id}`,
    ids.openalex_id          && `OA: ${ids.openalex_id}`,
    ids.semantic_scholar_id  && `S2: ${ids.semantic_scholar_id}`,
  ].filter(Boolean).map(x => `<span class="id-pill">${esc(x)}</span>`).join("");

  const pid = p.paper_id || "";
  const crudRow = serverMode && pid ? `
    <div class="crud-row" onclick="event.stopPropagation()">
      <button class="crud-btn btn-edit"   onclick="editPaper(event,'${pid}')">Edit</button>
      <button class="crud-btn btn-reject" onclick="rejectPaper(event,'${pid}')">Reject</button>
    </div>` : "";

  const embLine = p.embedding_score != null
    ? `<span class="emb-score">e:${p.embedding_score.toFixed(2)}</span>` : "";

  return `
<div class="paper-card" id="card-${uid}">
  <div class="paper-main" onclick="toggle('d${uid}')">
    <div class="score-col">
      <span class="score-num s-${lvl}">${p.score.toFixed(2)}</span>
      <div class="score-track"><div class="score-fill sf-${lvl}" style="width:${pct}%"></div></div>
      ${embLine}
    </div>
    <div class="paper-body">
      <a class="paper-title" href="${p.url || "#"}" target="_blank" rel="noopener"
         onclick="event.stopPropagation()">${highlight(p.title, searchQuery)}</a>
      <div class="paper-meta">${esc(auth)} · ${p.year || "—"}</div>
      <div class="paper-srcs">${srcs}</div>
    </div>
    <div class="paper-acts">
      ${links}
      ${crudRow}
    </div>
  </div>
  <div class="paper-detail" id="d${uid}">
    <div class="abstract">${p.abstract ? highlight(p.abstract, searchQuery) : '<span style="color:var(--faint)">No abstract available.</span>'}</div>
    ${pills ? `<div class="detail-ids">${pills}</div>` : ""}
  </div>
</div>`;
}

function renderPapers() {
  const data  = sorted();
  const start = page * PAGE;
  const slice = data.slice(start, start + PAGE);
  document.getElementById("result-count").textContent =
    `${data.length} of ${papers.length} papers`;
  document.getElementById("paper-list").innerHTML =
    slice.map((p, i) => paperCard(p, start + i)).join("");

  const total = Math.ceil(data.length / PAGE);
  document.getElementById("pagination").innerHTML = total <= 1 ? "" : `
    <button class="page-btn" onclick="goPage(${page-1})" ${page===0?"disabled":""}>← Prev</button>
    <span class="page-info">Page ${page+1} of ${total}</span>
    <button class="page-btn" onclick="goPage(${page+1})" ${page>=total-1?"disabled":""}>Next →</button>`;
}

window.toggle  = id => { const el = document.getElementById(id); if (el) el.classList.toggle("open"); };
window.goPage  = p  => { page = p; renderPapers(); window.scrollTo(0, 0); };

document.getElementById("sort-sel").addEventListener("change", e => {
  sortKey = e.target.value; page = 0; renderPapers();
});
document.getElementById("score-range").addEventListener("input", e => {
  minScore = parseFloat(e.target.value);
  document.getElementById("score-lbl").textContent = minScore.toFixed(2);
  page = 0; renderPapers();
});
document.querySelectorAll(".src-chip").forEach(chip => chip.addEventListener("click", () => {
  const s = chip.dataset.src;
  if (activeSrc.has(s)) { activeSrc.delete(s); chip.classList.remove("on"); }
  else                  { activeSrc.add(s);    chip.classList.add("on");    }
  page = 0; renderPapers();
}));

const searchInput = document.getElementById("search-input");
const searchClear = document.getElementById("search-clear");

searchInput.addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    searchClear.classList.toggle("visible", searchQuery.length > 0);
    page = 0;
    renderPapers();
  }, 250);
});

searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchQuery = "";
  searchClear.classList.remove("visible");
  page = 0;
  renderPapers();
  searchInput.focus();
});

// ── Live search ────────────────────────────────────────────────────────────
window.liveSearch = async function() {
  const q = document.getElementById("live-q").value.trim();
  if (!q) return;

  const btn = document.getElementById("live-go");
  const stat = document.getElementById("live-status");
  btn.disabled = true;
  stat.textContent = "Searching…";
  document.getElementById("live-out").innerHTML = "";

  try {
    const result = await apiGet(`/api/search?q=${encodeURIComponent(q)}`);
    _liveCandidates = result.new_candidates || [];
    renderLiveResults(result);
    const nm = result.new_candidates?.length || 0;
    const dm = result.db_matches?.length || 0;
    stat.textContent = `${dm} in DB · ${nm} new`;
  } catch (err) {
    stat.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
};

// Allow Enter key in live-q input
document.getElementById("live-q").addEventListener("keydown", e => {
  if (e.key === "Enter") liveSearch();
});

function renderLiveResults(result) {
  const out = document.getElementById("live-out");
  let html = "";

  const db = result.db_matches || [];
  if (db.length) {
    html += `<div class="live-section-label">Similar in database (${db.length})</div>`;
    html += db.map(p => `
      <div class="cand-card in-db">
        <div>
          <div class="cand-title">${esc(p.title)}</div>
          <div class="cand-meta">${esc((p.authors||[]).slice(0,3).join(", "))} · ${p.year||"—"}</div>
          <div class="cand-scores">kw ${(p.score||0).toFixed(2)} · emb ${(p.db_score||0).toFixed(2)}</div>
        </div>
        <span style="font-size:11px;color:var(--green);font-weight:700">In DB</span>
      </div>`).join("");
  }

  const nc = result.new_candidates || [];
  if (nc.length) {
    html += `<div class="live-section-label">New candidates from APIs (${nc.length})</div>`;
    html += nc.map((p, i) => `
      <div class="cand-card" id="cand-${i}">
        <div>
          <div class="cand-title">${esc(p.title)}</div>
          <div class="cand-meta">${esc((p.authors||[]).slice(0,3).join(", "))} · ${p.year||"—"}</div>
          <div class="cand-scores">kw ${(p.score||0).toFixed(2)} · emb ${(p.embedding_score||0).toFixed(2)}</div>
          ${p.abstract ? `<div class="cand-abstract">${esc(p.abstract.slice(0,220))}…</div>` : ""}
        </div>
        <button class="btn-add" id="add-${i}" onclick="addCandidate(${i})">+ Add</button>
      </div>`).join("");
  }

  const errs = result.errors || [];
  if (errs.length) {
    html += `<div style="font-size:11px;color:var(--orange);margin-top:8px">API errors: ${errs.map(esc).join(" · ")}</div>`;
  }

  if (!html) html = `<div style="color:var(--muted);font-size:12px;padding:8px 0">No results found.</div>`;
  out.innerHTML = html;
}

window.addCandidate = async function(idx) {
  const p = _liveCandidates[idx];
  if (!p) return;
  const btn = document.getElementById(`add-${idx}`);
  if (btn) { btn.disabled = true; btn.textContent = "…"; }

  try {
    const added = await apiPost("/api/candidates/add", p);
    papers.push(added);
    renderPapers();
    if (btn) btn.textContent = "✓ Added";
    showToast(`"${p.title.slice(0,50)}" added`, "ok");
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "+ Add"; }
    const msg = err.message.includes("already") ? "Already in database" : "Error: " + err.message;
    showToast(msg, "err");
  }
};

// ── CRUD: papers ───────────────────────────────────────────────────────────
window.rejectPaper = async function(e, paperId) {
  e.stopPropagation();
  const reason = prompt("Rejection reason:", "not_relevant");
  if (reason === null) return;
  try {
    await apiPost(`/api/papers/${paperId}/reject`, { reason: reason || "manually_rejected" });
    const p = papers.find(x => x.paper_id === paperId);
    papers = papers.filter(x => x.paper_id !== paperId);
    if (p) { p.rejection_reason = reason || "manually_rejected"; rejects.push(p); }
    renderPapers();
    renderRejects();
    showToast("Moved to rejects", "warn");
  } catch (err) { showToast("Error: " + err.message, "err"); }
};

window.editPaper = function(e, paperId) {
  e.stopPropagation();
  const p = papers.find(x => x.paper_id === paperId);
  if (!p) return;

  const formId = `ef-${paperId}`;
  const existing = document.getElementById(formId);
  if (existing) { existing.classList.toggle("open"); return; }

  const card = document.querySelector(`[id^="card-"]`);
  // Find the detail element for this paper by locating it via closest()
  const btn = e.target;
  const paperCard = btn.closest(".paper-card");
  if (!paperCard) return;
  const detail = paperCard.querySelector(".paper-detail");
  if (!detail) return;
  detail.classList.add("open");

  const form = document.createElement("div");
  form.id = formId;
  form.className = "edit-form open";
  form.innerHTML = `
    <label class="ef-label">Title</label>
    <input class="ef-input" type="text" id="ef-t-${paperId}" value="${esc(p.title||"")}">
    <label class="ef-label">Year</label>
    <input class="ef-input" type="number" id="ef-y-${paperId}" value="${p.year||""}" style="max-width:100px">
    <label class="ef-label">Abstract</label>
    <textarea class="ef-textarea" rows="5" id="ef-a-${paperId}">${esc(p.abstract||"")}</textarea>
    <div class="ef-actions">
      <button class="crud-btn btn-save" onclick="saveEdit('${paperId}')">Save</button>
      <button class="crud-btn" onclick="cancelEdit('${paperId}')">Cancel</button>
    </div>`;
  detail.appendChild(form);
};

window.saveEdit = async function(paperId) {
  const title    = document.getElementById(`ef-t-${paperId}`)?.value?.trim();
  const yearVal  = document.getElementById(`ef-y-${paperId}`)?.value;
  const year     = yearVal ? parseInt(yearVal) : null;
  const abstract = document.getElementById(`ef-a-${paperId}`)?.value?.trim() || null;

  try {
    const updated = await apiPut(`/api/papers/${paperId}`, { title, year, abstract });
    const idx = papers.findIndex(x => x.paper_id === paperId);
    if (idx >= 0) papers[idx] = updated;
    renderPapers();
    showToast("Paper updated", "ok");
  } catch (err) { showToast("Error: " + err.message, "err"); }
};

window.cancelEdit = function(paperId) {
  const form = document.getElementById(`ef-${paperId}`);
  if (form) form.classList.remove("open");
};

// ── CRUD: rejects ──────────────────────────────────────────────────────────
window.approvePaper = async function(e, paperId) {
  e.stopPropagation();
  try {
    await apiPost(`/api/rejects/${paperId}/approve`, {});
    const p = rejects.find(x => x.paper_id === paperId);
    rejects = rejects.filter(x => x.paper_id !== paperId);
    if (p) { p.rejection_reason = null; papers.push(p); }
    renderPapers();
    renderRejects();
    showToast("Paper approved", "ok");
  } catch (err) { showToast("Error: " + err.message, "err"); }
};

window.deletePaper = async function(e, paperId) {
  e.stopPropagation();
  if (!confirm("Permanently delete this paper?")) return;
  try {
    await apiDelete(`/api/papers/${paperId}`);
    papers = papers.filter(x => x.paper_id !== paperId);
    renderPapers();
    showToast("Paper deleted", "warn");
  } catch (err) { showToast("Error: " + err.message, "err"); }
};

// ── Survey config ──────────────────────────────────────────────────────────
function renderConfig() {
  const c   = config;
  const rqs = (c.research_questions || [])
    .map(q => `<div class="cfg-rq">${esc(q)}</div>`).join("");
  const hints = (c.query_hints || [])
    .map(h => `<span class="cfg-pill">${esc(h)}</span>`).join("");

  document.getElementById("config-body").innerHTML = `
    <div class="cfg-section">
      <div class="cfg-label">Topic overview</div>
      <div class="cfg-value">${esc(c.topic_overview || "—")}</div>
    </div>
    <div class="cfg-section">
      <div class="cfg-label">Research questions</div>
      ${rqs || "<span style='color:var(--muted)'>None</span>"}
    </div>
    <div class="cfg-section">
      <div class="cfg-label">Query hints</div>
      <div>${hints || "<span style='color:var(--muted)'>None</span>"}</div>
    </div>
    ${c.question_context ? `
    <div class="cfg-section">
      <div class="cfg-label">Context</div>
      <div class="cfg-value">${esc(c.question_context)}</div>
    </div>` : ""}
    <div class="cfg-section">
      <div class="cfg-label">Timeline</div>
      <div class="cfg-value">${c.timeline_from_year ?? "—"} – ${c.timeline_to_year ?? "—"}</div>
    </div>
    <div class="cfg-section">
      <div class="cfg-label">Min relevance score</div>
      <div class="cfg-value">${c.min_relevance_score ?? "—"}</div>
    </div>`;
}

// ── Run history ────────────────────────────────────────────────────────────
function renderHistory() {
  if (!history.length) {
    document.getElementById("history-body").innerHTML =
      '<p class="empty-state">No runs recorded yet.</p>';
    return;
  }
  const rows = [...history].reverse().map(r => {
    const dur = (r.started_at && r.finished_at)
      ? ((new Date(r.finished_at) - new Date(r.started_at)) / 1000).toFixed(0) + "s"
      : "—";
    const errCount = (r.errors || []).length;
    return `<tr>
      <td><span class="badge" style="font-size:10px">${esc(r.architecture)}</span></td>
      <td>${new Date(r.started_at).toLocaleString()}</td>
      <td>${r.queries_generated}</td>
      <td>${r.candidates_found}</td>
      <td>${r.candidates_after_dedupe}</td>
      <td class="ok">${r.papers_accepted}</td>
      <td style="color:var(--orange)">${r.candidates_rejected}</td>
      <td>${dur}</td>
      <td class="${errCount ? "err" : "ok"}">${errCount || "✓"}</td>
    </tr>`;
  }).join("");

  document.getElementById("history-body").innerHTML = `
    <table>
      <thead><tr>
        <th>Arch</th><th>Run time</th><th>Queries</th>
        <th>Raw</th><th>Deduped</th><th>Accepted</th>
        <th>Rejected</th><th>Duration</th><th>Errors</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Rejects ────────────────────────────────────────────────────────────────
function renderRejects() {
  if (!rejects.length) {
    document.getElementById("rejects-body").innerHTML =
      '<p class="empty-state">No rejected candidates.</p>';
    return;
  }
  const cards = rejects.map((p, i) => {
    const lvl  = scoreLevel(p.score);
    const auth = (p.authors || []).slice(0, 3).join(", ") +
                 ((p.authors || []).length > 3 ? " et al." : "");
    const pid = p.paper_id || "";
    const crudRow = serverMode && pid ? `
      <div class="crud-row" onclick="event.stopPropagation()">
        <button class="crud-btn btn-approve" onclick="approvePaper(event,'${pid}')">Approve</button>
        <button class="crud-btn btn-delete"  onclick="deletePaper(event,'${pid}')">Delete</button>
      </div>` : "";

    return `
<div class="paper-card">
  <div class="paper-main" onclick="toggle('r${i}')">
    <div class="score-col">
      <span class="score-num s-${lvl}">${p.score.toFixed(2)}</span>
      ${p.embedding_score != null ? `<span class="emb-score">e:${p.embedding_score.toFixed(2)}</span>` : ""}
    </div>
    <div class="paper-body">
      <a class="paper-title" href="${p.url || "#"}" target="_blank" rel="noopener"
         onclick="event.stopPropagation()">${esc(p.title)}</a>
      <div class="paper-meta">${esc(auth)} · ${p.year || "—"}</div>
      <div style="margin-top:5px">
        <span class="reject-reason">${esc(p.rejection_reason || "unknown")}</span>
      </div>
    </div>
    <div class="paper-acts">${crudRow}</div>
  </div>
  <div class="paper-detail" id="r${i}">
    <div class="abstract">${p.abstract ? esc(p.abstract) : '<span style="color:var(--faint)">No abstract available.</span>'}</div>
  </div>
</div>`;
  }).join("");

  document.getElementById("rejects-body").innerHTML =
    `<div style="display:flex;flex-direction:column;gap:6px">${cards}</div>`;
}

// ── Util ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

init();
</script>
